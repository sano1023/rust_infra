name: repia-docker

x-service-defaults: &service-defaults
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    <<: *service-defaults
    image: postgres:17.12-bookworm
    user: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8 --auth-host=scram-sha-256
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 60s

  redis:
    <<: *service-defaults
    image: redis:7.4.12-alpine3.22
    user: redis
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    stop_grace_period: 30s

  mailpit:
    <<: *service-defaults
    image: axllent/mailpit:v1.32.0
    user: "1000:1000"
    environment:
      MP_DATABASE: /tmp/mailpit.db
      MP_MAX_MESSAGES: "500"
      MP_DISABLE_VERSION_CHECK: "true"
      MP_SMTP_DISABLE_RDNS: "true"
      MP_SMTP_RELAY_ALL: "false"
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    <<: *service-defaults
    profiles: ["app"]
    build:
      context: ./docker/rust
      target: development
      args:
        LOCAL_UID: ${LOCAL_UID:-1000}
        LOCAL_GID: ${LOCAL_GID:-1000}
    init: true
    working_dir: /app
    environment:
      LOCO_ENV: development
      RUST_LOG: ${RUST_LOG:-info}
      RUST_BACKTRACE: "1"
      DATABASE_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      REDIS_URL: redis://redis:6379/0
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      APP_COMMAND: ${APP_COMMAND:-cargo run -- start --binding 0.0.0.0 --port 5150}
      WATCH_POLL_INTERVAL: ${WATCH_POLL_INTERVAL:-1s}
    volumes:
      - ./html/app:/app
      - cargo_registry:/usr/local/cargo/registry
      - cargo_git:/usr/local/cargo/git
      - cargo_target:/app/target
    networks:
      - backend
      - frontend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "if [ ! -f /app/Cargo.toml ]; then exit 0; fi; curl --fail --silent --max-time 3 http://127.0.0.1:5150/_ping >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    stop_grace_period: 30s

  nginx:
    <<: *service-defaults
    profiles: ["app"]
    image: nginx:1.30.6-alpine3.24
    user: "101:101"
    cap_drop: ["ALL"]
    entrypoint: ["nginx"]
    command: ["-c", "/etc/nginx/repia.conf", "-g", "daemon off;"]
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/repia.conf:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${HTTP_PORT:-80}:8080"
    networks:
      - frontend
    depends_on:
      app:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 5
    stop_grace_period: 30s

networks:
  backend:
    internal: true
  frontend:

volumes:
  postgres_data:
  redis_data:
  cargo_registry:
  cargo_git:
  cargo_target:
